name: Build Android Release (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK (Fire TV / Android) & AAB (Play Store)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run Expo Prebuild (Android)
        working-directory: app
        run: npx expo prebuild --platform android --clean

      - name: Decode Production Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks

      - name: Build Signed Release APK and AAB
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: /tmp/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk dist/HebigatRadio-v1.0.0-vc4-firetv-android.apk
          cp app/android/app/build/outputs/bundle/release/app-release.aab dist/HebigatRadio-v1.0.0-vc4-playstore.aab
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HebigatRadio-v1.0.0-vc4-release
          path: |
            dist/HebigatRadio-v1.0.0-vc4-firetv-android.apk
            dist/HebigatRadio-v1.0.0-vc4-playstore.aab
          if-no-files-found: error

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Hebigat Radio v1.0.0 (Version Code 4 - Amazon Fire TV Stick & Google Play)
          body: |
            ## Hebigat Radio v1.0.0 (Version Code 4)
            - **Amazon Fire TV Stick (Fire OS) & Android TV support**:
              - Added Leanback TV launcher intent (`LEANBACK_LAUNCHER`) and 320×180 TV home screen banner (`tv_banner`).
              - Declared `android.hardware.touchscreen`, `android.software.leanback`, and `android.hardware.wifi` as non-required (`required="false"`) for universal TV + phone compatibility.
              - Added 16:9 widescreen TV layout and Amazon Fire TV Remote D-Pad / Media Play-Pause key handling.
            - **Downloads**:
              - `HebigatRadio-v1.0.0-vc4-firetv-android.apk` — Signed universal APK for Amazon Fire TV Stick (sideload / Amazon Appstore) and Android devices.
              - `HebigatRadio-v1.0.0-vc4-playstore.aab` — Signed Android App Bundle (`.aab`) for Google Play Console (Closed Testing / Production).
          files: |
            dist/HebigatRadio-v1.0.0-vc4-firetv-android.apk
            dist/HebigatRadio-v1.0.0-vc4-playstore.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
